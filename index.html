<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lode al gatto</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4efe7;
      font-family: Arial, sans-serif;
      color: #2d2d2d;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 24px;
      max-width: 560px;
      text-align: center;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?auto=format&fit=crop&w=1200&q=80"
      alt="Cat sitting on a chair"
    />
    <h1>Lode al gatto</h1>
  </div>
</body>
</html>
